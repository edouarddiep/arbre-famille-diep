<button type="button" class="medallion" (click)="selected.emit(person())">
  @if (person().thumbnail; as portrait) {
    <img [src]="portrait" [alt]="person().name" width="160" height="160" loading="lazy" decoding="async" />
  } @else {
    <span class="medallion__initial" [attr.aria-label]="person().name">{{ initial() }}</span>
  }
</button>

<span class="plate">
  <span class="plate__year">{{ birthYear() }}</span>
  <span class="plate__name">
    {{ person().name.split(' ')[0] }}
    @if (person().heritage; as origin) {
      <span class="flag" [class.flag--vn]="origin === Heritage.Vietnamese" [attr.aria-label]="
        origin === Heritage.Vietnamese ? 'Origine vietnamienne' : 'Origine grecque'"></span>
    }
  </span>

  @if (kinship(); as bond) {
    <button type="button" class="plate__kin" [attr.aria-label]="label() + ' — aller vers ' + bond.names.join(' et ')"
      (click)="ascend.emit()">
      @for (part of parts(); track part) {
        <span>{{ part }}</span>
      }
    </button>
  }
</span>
